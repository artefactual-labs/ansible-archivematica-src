---

- name: "Destroy virtualenv when it's using a different version"
  block:
    - name: "Capture current Python version"
      command: |-
        {{ archivematica_src_am_virtualenv }}/bin/python -c
          'import sys; print("python"+str(sys.version_info[0])+"."+str(sys.version_info[1]))'
      failed_when: false
      changed_when: false
      check_mode: false
      register: "pyver_check"
    - name: "Destroy Python virtualenv when it's using a different version"
      file:
        path: "{{ archivematica_src_am_virtualenv }}"
        state: "absent"
      when: "pyver_check.rc == 0 and pyver_check.stdout != archivematica_src_virtualenv_python"

- name: "Ensure archivematica user can create virtualenv"
  file:
    path: "{{ archivematica_src_am_virtualenv | dirname }}"
    owner: "archivematica"
    group: "archivematica"
    state: "directory"
    recurse: true

- name: "Rebuild Archivematica mysqlclient when it no longer loads"
  import_tasks: "uv-relink-mysqlclient.yml"
  vars:
    __archivematica_src_mysqlclient_virtualenv: "{{ archivematica_src_am_virtualenv }}"
    __archivematica_src_mysqlclient_project_dir: "{{ archivematica_src_dir }}/archivematica"

- name: "Synchronize locked Archivematica dependencies"
  become: "yes"
  become_user: "archivematica"
  command: >-
    make {{ 'sync' if is_dev else 'sync-runtime' }}
    UV={{ archivematica_src_uv }}
  register: "__archivematica_src_am_sync"
  changed_when: >-
    'Installed ' in __archivematica_src_am_sync.stderr or
    'Uninstalled ' in __archivematica_src_am_sync.stderr
  args:
    chdir: "{{ archivematica_src_dir }}/archivematica"
  environment:
    LC_ALL: "en_US.utf8"
    LANG: "en_US.utf8"
    UV_PROJECT_ENVIRONMENT: "{{ archivematica_src_am_virtualenv }}"
    UV_PYTHON: "{{ archivematica_src_virtualenv_python }}"
    UV_PYTHON_DOWNLOADS: "never"

- name: "Verify Archivematica mysqlclient after synchronization"
  import_tasks: "uv-verify-mysqlclient.yml"
  vars:
    __archivematica_src_mysqlclient_virtualenv: "{{ archivematica_src_am_virtualenv }}"
