---

- name: "Check Python before replacing the application virtualenv"
  block:
    - name: "Check that the selected Python can create virtualenvs"
      command: "{{ archivematica_src_virtualenv_python }} -c 'import ensurepip, venv'"
      changed_when: false
      check_mode: false

    - name: "Check for an existing virtualenv"
      stat:
        path: "{{ archivematica_src_am_virtualenv }}"
      register: "virtualenv_check"

    - name: "Capture current virtualenv Python version"
      command: >-
        {{ archivematica_src_am_virtualenv }}/bin/python -c
        'import sys; print("python" + str(sys.version_info[0]) + "." + str(sys.version_info[1]))'
      failed_when: false
      changed_when: false
      check_mode: false
      register: "pyver_check"
      when: virtualenv_check.stat.exists

    - name: "Remove virtualenv when Python changed or the interpreter is broken"
      file:
        path: "{{ archivematica_src_am_virtualenv }}"
        state: "absent"
      when:
        - virtualenv_check.stat.exists
        - pyver_check.rc != 0 or pyver_check.stdout != archivematica_src_virtualenv_python

- name: "Ensure archivematica user can create virtualenv"
  file:
    path: "{{ archivematica_src_am_virtualenv | dirname }}"
    owner: "archivematica"
    group: "archivematica"
    state: "directory"
    recurse: true

- name: "Create virtualenv and install pip-tools"
  become: "yes"
  become_user: "archivematica"
  pip:
    virtualenv: "{{ archivematica_src_am_virtualenv }}"
    virtualenv_command: "{{ archivematica_src_virtualenv }}"
    name: 
      - "pip=={{ archivematica_src_pip_version }}"
      - "pip-tools=={{ archivematica_src_pip_tools_version }}"

- name: "Synchronize requirements"
  become: "yes"
  become_user: "archivematica"
  command: "{{ archivematica_src_am_virtualenv }}/bin/pip-sync {{ 'requirements-dev.txt' if is_dev else 'requirements.txt' }}"
  args:
    chdir: "{{ archivematica_src_dir }}/archivematica"
  environment:
    LC_ALL: "en_US.utf8"
    LANG: "en_US.utf8"
