---
# In the past the nodejs was installed and configured using 
# the geerlingguy/ansible-role-nodejs role as a role dependency.
# We had problems with ansible < 2.10 and Rocky support
# This is the https://github.com/geerlingguy/ansible-role-nodejs role
# but added here as a task file

# Debian setup

- name: "Nodejs setup (Debian)"
  block:

  - name: "Nodejs: Ensure dependencies are present"
    apt:
      name:
        - apt-transport-https
        - gnupg2
      state: present

  # apt-key is gone since Ubuntu 26.04 (apt 3.2), so download the armored key
  # into trusted.gpg.d, which apt reads directly.
  - name: "Nodejs: Add Nodesource apt key"
    get_url:
      url: https://keyserver.ubuntu.com/pks/lookup?op=get&fingerprint=on&search=0x6F71F525282841EEDAF851B42F59B5F99B1BE0B4
      dest: "/etc/apt/trusted.gpg.d/nodesource.asc"
      mode: "0644"

  - name: "Nodejs: Add NodeSource repositories for Node.js"
    apt_repository:
      repo: "{{ item }}"
      state: present
    with_items:
      - "deb https://deb.nodesource.com/node_{{ nodejs_version }} nodistro main"
      - "deb-src https://deb.nodesource.com/node_{{ nodejs_version }} nodistro main"
    register: node_repo

  - name: "Nodejs: Update apt cache if repo was added"
    apt: update_cache=yes
    when: node_repo is changed
    tags: ['skip_ansible_lint']

  - name: "Nodejs: Ensure Node.js and npm are installed"
    apt:
      name: "nodejs={{ nodejs_version | regex_replace('x', '') }}*"
      state: present

  when:
   - ansible_os_family == "Debian"

# CentOS/Rockey/RHEL setup

- name: "Nodejs setup (CentOS/Rocky/RHEL)"
  block:
    - name: "Remove conflicting packages"
      dnf:
        name: "nodejs*"
        state: absent

    - name: "Import NodeSource RPM signing key"
      rpm_key:
        key: "https://rpm.nodesource.com/gpgkey/ns-operations-public.key"
        state: present
      when: install_rpm_repositories|bool

    # The nodejs module stream in AppStream (EL8/EL9) hides non-modular packages
    # with the same name; module_hotfixes disables that filtering for this repo.
    # EL10 has no module system and ignores the option.
    - name: "Add NodeSource repository for Node.js {{ nodejs_version }}"
      yum_repository:
        name: "nodesource-nodejs"
        description: "Node.js {{ nodejs_version }} packages from NodeSource - $basearch"
        baseurl: "https://rpm.nodesource.com/pub_{{ nodejs_version }}/nodistro/nodejs/$basearch"
        gpgcheck: yes
        gpgkey: "https://rpm.nodesource.com/gpgkey/ns-operations-public.key"
        module_hotfixes: yes
        enabled: yes
      when: install_rpm_repositories|bool

    - name: "Ensure Node.js and npm are installed"
      dnf:
        name: "nodejs-{{ nodejs_version | regex_replace('x', '') }}*"
        state: present

  when:
   - ansible_os_family in ['RedHat','Rocky']

- name: "Nodejs: Define nodejs_install_npm_user"
  set_fact:
    nodejs_install_npm_user: "{{ ansible_user | default(lookup('env', 'USER')) }}"
  when: nodejs_install_npm_user is not defined

- name: "Nodejs: Create npm global directory"
  file:
    path: "{{ npm_config_prefix }}"
    owner: "{{ nodejs_install_npm_user }}"
    group: "{{ nodejs_install_npm_user }}"
    state: directory
    mode: 0755

- name: "Nodejs: Add npm_config_prefix bin directory to global $PATH"
  template:
    src: etc/npm/npm.sh.j2
    dest: /etc/profile.d/npm.sh
    mode: 0644
  when: nodejs_generate_etc_profile|bool

- name: "Nodejs: Ensure npm global packages are installed"
  npm:
    name: "{{ item.name | default(item) }}"
    version: "{{ item.version | default(omit) }}"
    global: true
    state: "{{ item.state | default('present') }}"
  environment:
    NPM_CONFIG_PREFIX: "{{ npm_config_prefix }}"
    NODE_PATH: "{{ npm_config_prefix }}/lib/node_modules"
    NPM_CONFIG_UNSAFE_PERM: "{{ npm_config_unsafe_perm }}"
  with_items: "{{ nodejs_npm_global_packages }}"

- name: "Nodejs: Install packages defined in a given package.json"
  npm:
    path: "{{ nodejs_package_json_path | default(omit) }}"
  when:
    - nodejs_package_json_path is defined
    - nodejs_package_json_path | length > 0
